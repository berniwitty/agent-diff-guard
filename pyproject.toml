[project]
name = "agent-diff-guard"
version = "0.0.0"
description = "Catch the shortcuts coding agents take to make a task look done."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
adg = "agent_diff_guard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_diff_guard"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixture trees are inputs for adg and deliberately contain the shortcuts it detects.
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
# Markdown code blocks (spec, rule docs with "bad" examples) are kept as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["agent_diff_guard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
