[project]
# "agent-diff-guard" is taken on PyPI; the command (adg) and import name are unchanged.
name = "shortcut-guard"
dynamic = ["version"]
description = "Catch the shortcuts coding agents take to make a task look done."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai-agents", "code-review", "git", "linter", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.27.3",
]

[project.urls]
Repository = "https://github.com/berniwitty/agent-diff-guard"

[project.scripts]
adg = "agent_diff_guard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent_diff_guard/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_diff_guard"]

[tool.hatch.build.targets.wheel.force-include]
"docs/rules" = "agent_diff_guard/rule_docs"

[tool.agent-diff-guard]
# Fixture trees are rule inputs and contain the shortcuts adg reports, on purpose.
exclude = ["tests/fixtures/"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixture trees are inputs for adg and deliberately contain the shortcuts it detects.
extend-exclude = ["tests/fixtures"]

[tool.ruff.format]
# Markdown code blocks (spec, rule docs with "bad" examples) are kept as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["agent_diff_guard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
